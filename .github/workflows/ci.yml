name: quality
on: [push, pull_request]
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # CI-only fixture; Compose validates every service even for infrastructure-only commands.
      ADMIN_PHONE: '09120000000'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: .bun-version }
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('.bun-version', 'bun.lock', 'bunfig.toml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bun-
      - run: bun scripts/init-env.mjs
      - run: bun install --frozen-lockfile
      - run: docker compose up -d --wait --wait-timeout 180 --build postgres redis minio clamav
      - run: bun run db:generate
      - run: bun run db:migrate
      - run: bun --env-file=.env scripts/init-storage.ts
      - run: docker compose exec -T postgres createdb -U niticket niticket_test
      - run: bun --env-file=.env scripts/test-database.mjs
      - run: bun run format:check && bun run typecheck && bun run lint && bun run test && bun run test:integration
      - run: bun run build
      - run: bun --bun playwright install --with-deps chromium
      - run: docker compose build worker && docker compose up -d --no-deps --wait --wait-timeout 120 worker
      - run: bun run test:e2e
      - run: bun audit --prod --audit-level=high
      - run: docker compose build web worker
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: test-evidence, path: "test-results/\nplaywright-report/" }
