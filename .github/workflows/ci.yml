name: quality
on: [push, pull_request]
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.5.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: node scripts/init-env.mjs
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait --wait-timeout 180 --build postgres redis minio clamav mailpit
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm exec tsx --env-file=.env scripts/init-storage.ts
      - run: docker compose exec -T postgres createdb -U niticket niticket_test
      - run: node --env-file=.env scripts/test-database.mjs
      - run: pnpm format:check && pnpm typecheck && pnpm lint && pnpm test && pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: docker compose build worker && docker compose up -d --no-deps --wait --wait-timeout 120 worker
      - run: pnpm test:e2e
      - run: pnpm audit --prod --audit-level=high
      - run: docker compose build web worker
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: test-evidence, path: "test-results/\nplaywright-report/" }
